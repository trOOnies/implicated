{% extends "base.html" %}
{% set active = 'songs' %}
{% block title %}Songs{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Songs</h1>
  <form id="song-filters" class="filters" hx-get="/fragments/songs" hx-target="#songs" hx-swap="innerHTML"
        hx-trigger="input changed delay:300ms, change">
    <input type="search" name="q" value="{{ q }}" placeholder="Search title, artist, album…">
    <select name="order" data-sort-reset="songs">
      <option value="title" {% if order == 'title' %}selected{% endif %}>A–Z</option>
      <option value="plays" {% if order == 'plays' %}selected{% endif %}>Most played</option>
      <option value="recent" {% if order == 'recent' %}selected{% endif %}>Recently played</option>
    </select>
    <label class="check"><input type="checkbox" name="favorites" value="1" {% if favorites %}checked{% endif %}> Favorites</label>
    <label class="check"><input type="checkbox" name="later" value="1" {% if later %}checked{% endif %}> Listen later</label>
    <label class="check"><input type="checkbox" name="missing" value="1" {% if missing %}checked{% endif %}> Missing lyrics</label>
  </form>
</div>
<section id="songs" class="card" hx-get="/fragments/songs" hx-trigger="songs-changed from:body"
         hx-include="#song-filters, #songs-page" hx-disinherit="hx-include" hx-swap="innerHTML">
  {% include "_songs.html" %}
</section>
{% endblock %}
