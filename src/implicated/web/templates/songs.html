{% extends "base.html" %}
{% set active = 'songs' %}
{% block title %}Songs{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Songs</h1>
  <form class="filters" hx-get="/fragments/songs" hx-target="#songs" hx-swap="innerHTML"
        hx-trigger="input changed delay:300ms, change, songs-changed from:body">
    <input type="search" name="q" value="{{ q }}" placeholder="Search title, artist, album…">
    <select name="order">
      <option value="title" {% if order == 'title' %}selected{% endif %}>A–Z</option>
      <option value="plays" {% if order == 'plays' %}selected{% endif %}>Most played</option>
      <option value="recent" {% if order == 'recent' %}selected{% endif %}>Recently played</option>
    </select>
    <label class="check"><input type="checkbox" name="favorites" value="1" {% if favorites %}checked{% endif %}> Favorites</label>
  </form>
</div>
<section id="songs" class="card">
  {% include "_songs.html" %}
</section>
{% endblock %}
