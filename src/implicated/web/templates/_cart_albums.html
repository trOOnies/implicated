{# The Album picker of the Add to cart form: `groups` are (heading, options) on the format in `form`, empty until one is picked. #}
<label id="cart-album">Album
  <select name="album_id" required{% if not groups %} disabled{% endif %}>
    {% if not form.get('format') %}
    <option value="">Pick a format first</option>
    {% elif not groups %}
    <option value="">Every album is already in the cart on {{ format_names[form.get('format')] }}</option>
    {% else %}
    <option value="">Pick an album…</option>
    {% for label, options in groups %}
    <optgroup label="{{ label }}">
      {% for o in options %}
      <option value="{{ o.album.id }}"{% if form.get('album_id') == o.album.id | string %} selected{% endif %}>{{ o.artist_name }} – {{ o.album.title }}{% if o.state == 'owned' %} ⚠ owned{% endif %}</option>
      {% endfor %}
    </optgroup>
    {% endfor %}
    {% endif %}
  </select>
</label>
