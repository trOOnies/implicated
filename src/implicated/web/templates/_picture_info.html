<section id="picture-info" class="card info">
  <div class="row">
    <h1>{{ picture.name }}</h1>
    <span class="spacer"></span>
    <button type="button" class="secondary" hx-get="/fragments/pictures/{{ picture.id }}/edit"
            hx-target="#picture-info" hx-swap="outerHTML">Edit</button>
    <button type="button" class="danger" hx-post="/pictures/{{ picture.id }}/delete"
            hx-confirm="Delete the picture {{ picture.name }}?">Delete</button>
  </div>
  <p class="muted small">File: <code>{{ picture.file_name }}</code> · added {{ picture.created_at | when }}</p>
  {% if picture.tags %}
  <p>{% for t in picture.tags %}<a class="tag" href="/artists/{{ artist.id }}/pictures?{{ {'tag': t} | urlencode }}" title="Pictures of {{ artist.name }} tagged {{ t }}">{{ t }}</a>{% endfor %}</p>
  {% endif %}
  {% if picture.description %}<p class="bio">{{ picture.description }}</p>{% endif %}
</section>
