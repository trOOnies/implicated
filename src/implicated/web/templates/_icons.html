{# Drawn icons for icon buttons (characters come from different fonts, some missing glyphs).
   `{% from "_icons.html" import icon %}`, then `{{ icon('edit') }}`. #}
{% macro icon(name) -%}
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'play' %}<path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/>
{%- elif name == 'edit' %}<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>
{%- elif name == 'copy' %}<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
{%- elif name == 'lock' %}<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
{%- elif name == 'unlock' %}<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.75-1.4"/>
{%- elif name == 'delete' %}<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/>
{%- endif %}</svg>
{%- endmacro %}
