{# Previous and next song on the album; greyed out at either end. #}
<nav class="song-nav" aria-label="Songs on this album">
  {% for neighbor, label, points in [(previous, 'Previous', '15 18 9 12 15 6'), (following, 'Next', '9 18 15 12 9 6')] %}
  {% set icon %}<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="{{ points }}"/></svg>{% endset %}
  {% if neighbor %}
  <a href="/songs/{{ neighbor.id }}" rel="{{ 'prev' if label == 'Previous' else 'next' }}" title="{{ label }}: {{ neighbor.title }}" aria-label="{{ label }} song: {{ neighbor.title }}">{{ icon }}</a>
  {% else %}
  <span class="disabled" title="{{ 'First' if label == 'Previous' else 'Last' }} song on the album" aria-disabled="true" aria-label="No {{ label | lower }} song">{{ icon }}</span>
  {% endif %}
  {% endfor %}
</nav>
